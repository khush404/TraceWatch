server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_gateway http://api-gateway:8000;
        proxy_pass $upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin *;
    }

    location /jaeger/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_jaeger http://jaeger:16686;
        rewrite ^/jaeger/(.*) /$1 break;
        proxy_pass $upstream_jaeger;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    location /prometheus/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_prometheus http://prometheus:9090;
        rewrite ^/prometheus/(.*) /$1 break;
        proxy_pass $upstream_prometheus;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
